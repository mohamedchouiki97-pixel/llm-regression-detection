[project]
name = "model-regression-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "openai>=3.19.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
mrd = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
